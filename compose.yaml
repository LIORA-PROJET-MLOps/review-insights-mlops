services:
  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    env_file:
      - .env.example
    environment:
      APP_ENV: docker
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  data:
    build:
      context: .
      dockerfile: docker/data/Dockerfile
    env_file:
      - .env.example
    environment:
      APP_ENV: docker
    ports:
      - "8001:8001"
    volumes:
      - ./models:/app/models:ro
      - reports:/app/reports
      - artifacts:/app/artifacts
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  monitoring:
    build:
      context: .
      dockerfile: docker/monitoring/Dockerfile
    env_file:
      - .env.example
    environment:
      APP_ENV: docker
      API_URL: http://api:8000
    ports:
      - "9000:9000"
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  streamlit:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    env_file:
      - .env.example
    environment:
      APP_ENV: docker
      API_URL: http://api:8000
      DATA_URL: http://data:8001
      MONITORING_URL: http://monitoring:9000
    ports:
      - "8501:8501"
    volumes:
      - ./models:/app/models:ro
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      data:
        condition: service_healthy
      monitoring:
        condition: service_healthy

volumes:
  reports:
  artifacts:
