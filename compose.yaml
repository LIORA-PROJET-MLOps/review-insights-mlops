x-dagster-common: &dagster-common
  build:
    context: .
    dockerfile: docker/orchestrator/Dockerfile
  profiles: ["control"]
  env_file:
    - .env.example
  environment:
    DAGSTER_PG_HOST: dagster-postgres
    DAGSTER_PG_USER: ${DAGSTER_DB_USER:-dagster}
    DAGSTER_PG_PASSWORD: ${DAGSTER_DB_PASSWORD:-change-me-dagster-db}
    DAGSTER_PG_DB: ${DAGSTER_DB_NAME:-dagster}
    MLFLOW_TRACKING_ENABLED: "true"
    MLFLOW_TRACKING_URI: http://mlflow:5000
    MLFLOW_EXPERIMENT_NAME: review-insights-orchestrated
    PUSHGATEWAY_URL: http://pushgateway:9091
    ORCHESTRATOR_DATA_ROOT: /app/data_store
    ORCHESTRATOR_INCOMING_DIR: /app/data_store/raw/incoming
    ORCHESTRATOR_MODEL_OUTPUT_ROOT: /app/artifacts/orchestrated_models
    ORCHESTRATOR_REPORT_ROOT: /app/reports/orchestration
    PREDICTION_EVENT_STORE_PATH: /app/predictions/prediction_events.jsonl
    FEEDBACK_STORE_PATH: /app/feedback/human_feedback.jsonl
    DRIFT_POLICY_PATH: /app/config/drift_policy_v1.json
    DRIFT_REPORT_PATH: /app/reports/drift/latest_drift_report.json
    GIT_COMMIT_SHA: ${GIT_COMMIT_SHA:-unknown}
    ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
  volumes:
    - orchestrator_data:/app/data_store
    - ./data/raw/incoming:/app/data_store/raw/incoming
    - artifacts:/app/artifacts
    - reports:/app/reports
    - prediction_data:/app/predictions:ro
    - feedback_data:/app/feedback:ro
    - ./models:/app/models
    - dagster_compute_logs:/opt/dagster/storage
  restart: unless-stopped

services:
  postgres:
    image: postgres:16.14-alpine@sha256:16bc17c64a573ef34162af9298258d1aec548232985b33ed7b1eac33ba35c229
    environment:
      POSTGRES_USER: ${MLFLOW_DB_USER:-mlflow}
      POSTGRES_PASSWORD: ${MLFLOW_DB_PASSWORD:-change-me-mlflow-db}
      POSTGRES_DB: ${MLFLOW_DB_NAME:-mlflow}
    volumes:
      - mlflow_postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${MLFLOW_DB_USER:-mlflow} -d ${MLFLOW_DB_NAME:-mlflow}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  minio:
    image: quay.io/minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-review-insights}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-me-minio-secret}
    ports:
      - "9100:9000"
      - "9101:9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  minio-init:
    image: quay.io/minio/mc@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-review-insights}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-me-minio-secret}
      MLFLOW_ARTIFACT_BUCKET: ${MLFLOW_ARTIFACT_BUCKET:-mlflow-artifacts}
      DVC_DATA_BUCKET: ${DVC_DATA_BUCKET:-review-insights-data}
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD;
      /usr/bin/mc mb --ignore-existing local/$$MLFLOW_ARTIFACT_BUCKET;
      /usr/bin/mc mb --ignore-existing local/$$DVC_DATA_BUCKET;
      "

  mlflow:
    build:
      context: .
      dockerfile: docker/mlflow/Dockerfile
    environment:
      MLFLOW_BACKEND_STORE_URI: postgresql+psycopg2://${MLFLOW_DB_USER:-mlflow}:${MLFLOW_DB_PASSWORD:-change-me-mlflow-db}@postgres:5432/${MLFLOW_DB_NAME:-mlflow}
      MLFLOW_ARTIFACTS_DESTINATION: s3://${MLFLOW_ARTIFACT_BUCKET:-mlflow-artifacts}
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-review-insights}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-change-me-minio-secret}
      AWS_DEFAULT_REGION: us-east-1
      MLFLOW_SERVER_ALLOWED_HOSTS: localhost:*,127.0.0.1:*,mlflow:5000
      MLFLOW_SERVER_CORS_ALLOWED_ORIGINS: http://localhost:5000,http://127.0.0.1:5000
    ports:
      - "5000:5000"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    env_file:
      - .env.example
    environment:
      APP_ENV: docker
      API_KEY: ${API_KEY:-}
      SENTIMENT_BACKEND: ${SENTIMENT_BACKEND:-project}
      HF_SENTIMENT_MODEL_ID: ${HF_SENTIMENT_MODEL_ID:-SebasLopez-ai/distilbert-amazon-reviews-sentiment}
      HF_SENTIMENT_REVISION: ${HF_SENTIMENT_REVISION:-881c6455b01b7ef50026f33902f6433651a1b1f0}
      MLFLOW_TRACKING_ENABLED: "true"
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_EXPERIMENT_NAME: review-insights-default
      PREDICTION_EVENT_STORE_PATH: /app/predictions/prediction_events.jsonl
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models:ro
      - transformer_sentiment_cache:/app/.cache/review_insights/sentiment
      - prediction_data:/app/predictions
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: ${API_START_PERIOD:-180s}

  data:
    build:
      context: .
      dockerfile: docker/data/Dockerfile
    env_file:
      - .env.example
    environment:
      APP_ENV: docker
      API_KEY: ${API_KEY:-}
      API_URL: http://api:8000
      ORCHESTRATOR_DATA_ROOT: /app/data_store
      FEEDBACK_STORE_PATH: /app/feedback/human_feedback.jsonl
      DRIFT_REPORT_PATH: /app/reports/drift/latest_drift_report.json
    ports:
      - "8001:8001"
    volumes:
      - ./models:/app/models:ro
      - reports:/app/reports
      - artifacts:/app/artifacts
      - orchestrator_data:/app/data_store:ro
      - feedback_data:/app/feedback
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  monitoring:
    build:
      context: .
      dockerfile: docker/monitoring/Dockerfile
    env_file:
      - .env.example
    environment:
      APP_ENV: docker
      API_KEY: ${API_KEY:-}
      API_URL: http://api:8000
    ports:
      - "9000:9000"
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  streamlit:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    env_file:
      - .env.example
    environment:
      APP_ENV: docker
      API_KEY: ${API_KEY:-}
      API_URL: http://api:8000
      DATA_URL: http://data:8001
      MONITORING_URL: http://monitoring:9000
    ports:
      - "8501:8501"
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      data:
        condition: service_healthy
      monitoring:
        condition: service_healthy

  dagster-postgres:
    image: postgres:16.14-alpine@sha256:16bc17c64a573ef34162af9298258d1aec548232985b33ed7b1eac33ba35c229
    profiles: ["control"]
    environment:
      POSTGRES_USER: ${DAGSTER_DB_USER:-dagster}
      POSTGRES_PASSWORD: ${DAGSTER_DB_PASSWORD:-change-me-dagster-db}
      POSTGRES_DB: ${DAGSTER_DB_NAME:-dagster}
    volumes:
      - dagster_postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DAGSTER_DB_USER:-dagster} -d ${DAGSTER_DB_NAME:-dagster}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  dagster-code:
    <<: *dagster-common
    command: ["dagster", "code-server", "start", "-h", "0.0.0.0", "-p", "4000", "-m", "orchestration.definitions"]
    depends_on:
      dagster-postgres:
        condition: service_healthy
      mlflow:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "dagster", "api", "grpc-health-check", "-h", "127.0.0.1", "-p", "4000"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 30s

  dagster-webserver:
    <<: *dagster-common
    command: ["dagster-webserver", "-h", "0.0.0.0", "-p", "3000", "-w", "/app/orchestration/workspace.yaml"]
    ports:
      - "3001:3000"
    depends_on:
      dagster-code:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3000/server_info', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  dagster-daemon:
    <<: *dagster-common
    command: ["dagster-daemon", "run", "-w", "/app/orchestration/workspace.yaml"]
    depends_on:
      dagster-code:
        condition: service_healthy

  pushgateway:
    image: prom/pushgateway:v1.11.3
    profiles: ["control"]
    ports:
      - "9091:9091"
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.28.1
    profiles: ["control"]
    command: ["--config.file=/etc/alertmanager/alertmanager.yml", "--storage.path=/alertmanager"]
    ports:
      - "9093:9093"
    volumes:
      - ./deploy/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    restart: unless-stopped

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.27.0
    profiles: ["control"]
    command: ["--config.file=/etc/blackbox_exporter/config.yml"]
    volumes:
      - ./deploy/blackbox/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    restart: unless-stopped

  cadvisor:
    image: ghcr.io/google/cadvisor:v0.57.0
    profiles: ["control"]
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
    restart: unless-stopped

  prometheus:
    build:
      context: .
      dockerfile: docker/prometheus/Dockerfile
    profiles: ["control"]
    environment:
      API_KEY: ${API_KEY:-}
    ports:
      - "9090:9090"
    volumes:
      - prometheus_data:/prometheus
    restart: unless-stopped
    depends_on:
      - monitoring
      - pushgateway
      - alertmanager
      - blackbox-exporter
      - cadvisor

  grafana:
    image: grafana/grafana:12.4.3
    profiles: ["control"]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change-me-grafana}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./deploy/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./deploy/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    restart: unless-stopped
    depends_on:
      - prometheus

volumes:
  reports:
  artifacts:
  mlflow_postgres_data:
  minio_data:
  transformer_sentiment_cache:
  orchestrator_data:
  dagster_postgres_data:
  dagster_compute_logs:
  prometheus_data:
  grafana_data:
  alertmanager_data:
  feedback_data:
  prediction_data:
