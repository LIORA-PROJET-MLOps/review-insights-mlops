global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: review-insights-monitoring
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /tmp/review_insights_api_key
    static_configs:
      - targets: ["monitoring:9000"]

  - job_name: pushgateway
    honor_labels: true
    static_configs:
      - targets: ["pushgateway:9091"]

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: blackbox-http
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://api:8000/health
          - http://data:8001/health
          - http://monitoring:9000/health
          - http://mlflow:5000/health
          - http://dagster-webserver:3000/server_info
          - http://streamlit:8501/_stcore/health
          - http://grafana:3000/api/health
          - http://alertmanager:9093/-/healthy
          - http://pushgateway:9091/-/healthy
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
