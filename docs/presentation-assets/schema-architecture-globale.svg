<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Architecture globale de Review Insights+</title>
  <desc id="desc">Architecture en quatre couches : canaux, services, coeur métier et socle MLOps.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="900" gradientUnits="userSpaceOnUse">
      <stop stop-color="#07111A"/>
      <stop offset="1" stop-color="#0B1A27"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#1FD3B5"/>
      <stop offset="1" stop-color="#6ED3FF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#6ED3FF"/>
    </marker>
    <style>
      .title{font:700 48px 'Plus Jakarta Sans',Arial,sans-serif;fill:#EEF5FB}
      .subtitle{font:400 22px 'Plus Jakarta Sans',Arial,sans-serif;fill:#A7BBCA}
      .layer{font:700 19px 'Plus Jakarta Sans',Arial,sans-serif;fill:#6ED3FF;letter-spacing:2px}
      .box-title{font:700 23px 'Plus Jakarta Sans',Arial,sans-serif;fill:#EEF5FB}
      .box-copy{font:400 17px 'Plus Jakarta Sans',Arial,sans-serif;fill:#A7BBCA}
      .dark-title{font:700 23px 'Plus Jakarta Sans',Arial,sans-serif;fill:#08222D}
      .dark-copy{font:500 16px 'Plus Jakarta Sans',Arial,sans-serif;fill:#123442}
      .panel{fill:#0F2231;stroke:#294356;stroke-width:2}
      .card{fill:#132B3C;stroke:#315066;stroke-width:2}
      .line{fill:none;stroke:#6ED3FF;stroke-width:3;marker-end:url(#arrow)}
    </style>
  </defs>

  <rect width="1600" height="900" rx="36" fill="url(#bg)"/>
  <circle cx="1380" cy="70" r="230" fill="#1FD3B5" opacity="0.05"/>
  <circle cx="180" cy="850" r="260" fill="#6ED3FF" opacity="0.04"/>

  <text class="title" x="70" y="72">Architecture globale de Review Insights+</text>
  <text class="subtitle" x="70" y="110">Une plateforme modulaire qui transforme les avis clients en signaux métier gouvernés.</text>

  <!-- Couche 1 -->
  <rect class="panel" x="70" y="145" width="1460" height="125" rx="26"/>
  <text class="layer" x="96" y="178">CANAUX D'ACCÈS</text>
  <g filter="url(#shadow)">
    <rect class="card" x="260" y="170" width="255" height="76" rx="18"/>
    <rect class="card" x="545" y="170" width="255" height="76" rx="18"/>
    <rect class="card" x="830" y="170" width="255" height="76" rx="18"/>
    <rect class="card" x="1115" y="170" width="255" height="76" rx="18"/>
  </g>
  <text class="box-title" x="387" y="203" text-anchor="middle">Interface Streamlit</text>
  <text class="box-copy" x="387" y="229" text-anchor="middle">Démo et analyse interactive</text>
  <text class="box-title" x="672" y="203" text-anchor="middle">Console web</text>
  <text class="box-copy" x="672" y="229" text-anchor="middle">Accès au backend online</text>
  <text class="box-title" x="957" y="203" text-anchor="middle">CSV / batch</text>
  <text class="box-copy" x="957" y="229" text-anchor="middle">Enrichissement de datasets</text>
  <text class="box-title" x="1242" y="203" text-anchor="middle">Clients API</text>
  <text class="box-copy" x="1242" y="229" text-anchor="middle">Intégrations applicatives</text>

  <!-- Couche 2 -->
  <rect class="panel" x="70" y="305" width="1460" height="170" rx="26"/>
  <text class="layer" x="96" y="340">SERVICES</text>
  <g filter="url(#shadow)">
    <rect x="245" y="342" width="350" height="105" rx="21" fill="url(#accent)"/>
    <rect class="card" x="625" y="342" width="350" height="105" rx="21"/>
    <rect class="card" x="1005" y="342" width="350" height="105" rx="21"/>
  </g>
  <text class="dark-title" x="420" y="380" text-anchor="middle">API d'inférence · FastAPI</text>
  <text class="dark-copy" x="420" y="408" text-anchor="middle">Validation, sécurité et POST /v1/analyze</text>
  <text class="dark-copy" x="420" y="432" text-anchor="middle">Healthcheck et métriques runtime</text>
  <text class="box-title" x="800" y="380" text-anchor="middle">Service data</text>
  <text class="box-copy" x="800" y="408" text-anchor="middle">Datasets, qualité et évaluation offline</text>
  <text class="box-copy" x="800" y="432" text-anchor="middle">Ingestion, splits et manifestes</text>
  <text class="box-title" x="1180" y="380" text-anchor="middle">Service monitoring</text>
  <text class="box-copy" x="1180" y="408" text-anchor="middle">Métriques JSON et Prometheus</text>
  <text class="box-copy" x="1180" y="432" text-anchor="middle">Lecture de l'état du runtime</text>

  <!-- Couche 3 -->
  <rect class="panel" x="70" y="510" width="1460" height="195" rx="26"/>
  <text class="layer" x="96" y="545">CŒUR MÉTIER ET MODÈLES</text>
  <g filter="url(#shadow)">
    <rect class="card" x="220" y="560" width="285" height="112" rx="21"/>
    <rect x="535" y="560" width="340" height="112" rx="21" fill="#163849" stroke="#1FD3B5" stroke-width="3"/>
    <rect class="card" x="905" y="560" width="285" height="112" rx="21"/>
    <rect x="1220" y="560" width="245" height="112" rx="21" fill="#302819" stroke="#F3B44F" stroke-width="2"/>
  </g>
  <text class="box-title" x="362" y="600" text-anchor="middle">Contrats Pydantic</text>
  <text class="box-copy" x="362" y="628" text-anchor="middle">Schémas et normalisation</text>
  <text class="box-copy" x="362" y="651" text-anchor="middle">des entrées / sorties</text>
  <text class="box-title" x="705" y="600" text-anchor="middle">ReviewAnalysisService</text>
  <text class="box-copy" x="705" y="628" text-anchor="middle">Orchestration, fusion des scores</text>
  <text class="box-copy" x="705" y="651" text-anchor="middle">et décision de revue humaine</text>
  <text class="box-title" x="1047" y="600" text-anchor="middle">Modèles projet</text>
  <text class="box-copy" x="1047" y="628" text-anchor="middle">Thèmes multi-label</text>
  <text class="box-copy" x="1047" y="651" text-anchor="middle">+ sentiment par thème</text>
  <text x="1342" y="600" text-anchor="middle" font-family="Plus Jakarta Sans,Arial" font-size="23" font-weight="700" fill="#F3B44F">Fallback règles</text>
  <text class="box-copy" x="1342" y="628" text-anchor="middle">Continuité de service</text>
  <text class="box-copy" x="1342" y="651" text-anchor="middle">si le modèle échoue</text>

  <!-- Couche 4 -->
  <rect class="panel" x="70" y="740" width="1460" height="110" rx="26"/>
  <text class="layer" x="96" y="775">SOCLE MLOPS &amp; OPS</text>
  <g>
    <rect class="card" x="265" y="765" width="235" height="62" rx="17"/>
    <rect class="card" x="525" y="765" width="235" height="62" rx="17"/>
    <rect class="card" x="785" y="765" width="235" height="62" rx="17"/>
    <rect class="card" x="1045" y="765" width="235" height="62" rx="17"/>
    <rect class="card" x="1305" y="765" width="165" height="62" rx="17"/>
  </g>
  <text class="box-title" x="382" y="803" text-anchor="middle">DVC · Data</text>
  <text class="box-title" x="642" y="803" text-anchor="middle">MLflow · Registry</text>
  <text class="box-title" x="902" y="803" text-anchor="middle">Docker · CI/CD</text>
  <text class="box-title" x="1162" y="803" text-anchor="middle">Prometheus · Grafana</text>
  <text class="box-title" x="1387" y="803" text-anchor="middle">HF Spaces</text>

  <!-- Flux -->
  <path class="line" d="M420 270V337"/>
  <path class="line" d="M800 270V337"/>
  <path class="line" d="M1180 270V337"/>
  <path class="line" d="M420 447V500H705V553"/>
  <path class="line" d="M800 447V500H705V553"/>
  <path class="line" d="M1180 447V500H1047V553"/>
  <path class="line" d="M505 616H528"/>
  <path class="line" d="M875 616H898"/>
  <path d="M1190 616H1213" fill="none" stroke="#F3B44F" stroke-width="3" marker-end="url(#arrow)"/>
</svg>
